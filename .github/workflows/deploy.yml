name: Build and Deploy to AWS ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist
        run: |
          aws ecr describe-repositories --repository-names telegram-ai-worker --region ${{ secrets.AWS_REGION || 'ap-south-1' }} ||           aws ecr create-repository --repository-name telegram-ai-worker --region ${{ secrets.AWS_REGION || 'ap-south-1' }}

          aws ecr describe-repositories --repository-names telegram-ai-web --region ${{ secrets.AWS_REGION || 'ap-south-1' }} ||           aws ecr create-repository --repository-name telegram-ai-web --region ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Build, tag, and push Worker container to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.worker -t $REGISTRY/telegram-ai-worker:$IMAGE_TAG -t $REGISTRY/telegram-ai-worker:latest .
          docker push $REGISTRY/telegram-ai-worker:$IMAGE_TAG
          docker push $REGISTRY/telegram-ai-worker:latest

      - name: Build, tag, and push Web container to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.web -t $REGISTRY/telegram-ai-web:$IMAGE_TAG -t $REGISTRY/telegram-ai-web:latest .
          docker push $REGISTRY/telegram-ai-web:$IMAGE_TAG
          docker push $REGISTRY/telegram-ai-web:latest

      - name: Trigger ECS Service Redeployments (if services exist)
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER || 'telegram-ai-cluster' }}
          REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
        run: |
          echo "Checking ECS cluster $CLUSTER..."
          if aws ecs describe-clusters --clusters "$CLUSTER" --region "$REGION" | grep -q 'ACTIVE'; then
            echo "Triggering rolling update for worker service..."
            aws ecs update-service --cluster "$CLUSTER" --service telegram-worker-service --force-new-deployment --region "$REGION" || echo "Worker service not created yet, image is ready in ECR."
            
            echo "Triggering rolling update for web service..."
            aws ecs update-service --cluster "$CLUSTER" --service telegram-web-service --force-new-deployment --region "$REGION" || echo "Web service not created yet, image is ready in ECR."
          else
            echo "ECS Cluster $CLUSTER not active yet. Images successfully pushed to ECR."
          fi
