name: Build and Deploy to AWS ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist
        run: |
          aws ecr describe-repositories \
            --repository-names telegram-ai-worker \
            --region "${{ secrets.AWS_REGION || 'ap-south-1' }}" \
            || aws ecr create-repository \
              --repository-name telegram-ai-worker \
              --region "${{ secrets.AWS_REGION || 'ap-south-1' }}"

          aws ecr describe-repositories \
            --repository-names telegram-ai-web \
            --region "${{ secrets.AWS_REGION || 'ap-south-1' }}" \
            || aws ecr create-repository \
              --repository-name telegram-ai-web \
              --region "${{ secrets.AWS_REGION || 'ap-south-1' }}"

      - name: Build, tag, and push Worker container to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.worker \
            -t "$REGISTRY/telegram-ai-worker:$IMAGE_TAG" \
            -t "$REGISTRY/telegram-ai-worker:latest" \
            .

          docker push "$REGISTRY/telegram-ai-worker:$IMAGE_TAG"
          docker push "$REGISTRY/telegram-ai-worker:latest"

      - name: Build, tag, and push Web container to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile.web \
            -t "$REGISTRY/telegram-ai-web:$IMAGE_TAG" \
            -t "$REGISTRY/telegram-ai-web:latest" \
            .

          docker push "$REGISTRY/telegram-ai-web:$IMAGE_TAG"
          docker push "$REGISTRY/telegram-ai-web:latest"

      # The web task embeds the worker.
      # Only the configured application service is restarted.
      - name: Deploy configured web service
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER || 'telegram-ai-cluster' }}
          REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          SERVICE: ${{ vars.ECS_WEB_SERVICE || secrets.ECS_WEB_SERVICE }}
        run: |
          set -euo pipefail

          : "${SERVICE:?Configure ECS_WEB_SERVICE with the web service name or ARN}"

          echo "Deploying ECS service: $SERVICE"
          echo "Cluster: $CLUSTER"
          echo "Region: $REGION"

          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment \
            --region "$REGION"

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$REGION"

          echo "ECS deployment completed successfully."
